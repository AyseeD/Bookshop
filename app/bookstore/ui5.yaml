specVersion: "4.0"
metadata:
  name: booksample
type: application
framework:
  name: OpenUI5
  version: "1.151.0"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: ui5-middleware-serveframework
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /browse
      configuration:
        baseUri: http://localhost:4004/browse/
    - name: ui5-middleware-livereload
      afterMiddleware: compression
